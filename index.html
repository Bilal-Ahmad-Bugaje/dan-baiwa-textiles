 if(!state.admin)return `<div class="login"><div class="loginbox"><img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=200&q=80"><span class="eyebrow">Private workspace</span><h1>Admin Studio</h1><p>Manage fabrics, enquiries and orders.</p><input id="adminEmail" placeholder="Admin email"><input id="adminPass" type="password" placeholder="Password"><button class="btn gold" id="loginBtn" style="width:100%">Sign in</button><small>Demo login for this UI prototype. Production version should use JWT + MongoDB.</small><button class="textbtn" id="backStore" style="border:0;background:none;margin-top:12px;font-size:10px">← Back to store</button></div></div>`;
 const tabs=[["overview","fa-chart-pie","Overview"],["products","fa-boxes-stacked","Fabrics"],["enquiries","fa-message","Enquiries"],["orders","fa-clipboard-list","Orders"],["customers","fa-users","Customers"]];
 return `<div class="app-admin"><aside class="side"><div class="sidebrand"><img src="https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=200&q=80"><span>Admin<br>Studio</span></div>${tabs.map(t=>`<button class="${state.tab===t[0]?"sel":""}" data-tab="${t[0]}"><i class="fa-solid ${t[1]}"></i>${t[2]}</button>`).join("")}<button id="backStore"><i class="fa-solid fa-store"></i> View Store</button><button class="signout" id="signout"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button></aside><main class="adminmain"><div class="admintop"><div><span class="eyebrow">Business control centre</span><h1>${state.tab[0].toUpperCase()+state.tab.slice(1)}</h1></div><button class="avatar">DB</button></div>${adminContent()}</main></div>`;
}
function adminContent(){
 if(state.tab==="overview")return `<div class="metrics"><div class="metric"><i class="fa-solid fa-boxes-stacked"></i><small>Active Fabrics</small><strong>${state.products.filter(p=>p.stock!=="Out of Stock").length}</strong></div><div class="metric"><i class="fa-solid fa-message"></i><small>New Enquiries</small><strong>${state.enquiries.filter(e=>e.status==="New").length}</strong></div><div class="metric"><i class="fa-solid fa-clipboard-list"></i><small>Open Orders</small><strong>${state.orders.filter(o=>o.status!=="Completed").length}</strong></div><div class="metric"><i class="fa-solid fa-triangle-exclamation"></i><small>Low Stock</small><strong>${state.products.filter(p=>p.stock==="Low Stock").length}</strong></div></div><div class="adminpanels"><div class="panel"><h3>Recent enquiries</h3>${state.enquiries.map(e=>`<div class="listrow"><span><b>${e.name}</b><small>${e.product} • ${e.qty}</small></span><em class="status ${e.status.toLowerCase()}">${e.status}</em></div>`).join("")}</div><div class="panel"><h3>Order pipeline</h3>${state.orders.map(o=>`<div class="listrow"><span><b>${o.id} • ${o.customer}</b><small>${o.items}</small></span><em class="status ${o.status.toLowerCase()}">${o.status}</em></div>`).join("")}</div></div>`;
 if(state.tab==="products")return `<div class="panel"><div class="adminhead"><h3>Fabric catalogue</h3><button class="add" id="addProduct"><i class="fa-solid fa-plus"></i> Add fabric</button></div>${state.products.map(p=>`<div class="adminproduct"><img src="${p.img}"><span><b>${p.name}</b><small>${p.cat} • ${p.stock}</small></span><button data-stock="${p.id}" title="Change stock"><i class="fa-solid fa-clock-rotate-left"></i></button><button data-delete="${p.id}" title="Delete"><i class="fa-solid fa-trash"></i></button></div>`).join("")}</div>`;
 if(state.tab==="enquiries")return `<div class="panel"><h3>Customer enquiries</h3>${state.enquiries.map((e,i)=>`<div class="listrow"><span><b>${e.name}</b><small>${e.product} • ${e.qty}</small></span><select data-enq="${i}"><option ${e.status==="New"?"selected":""}>New</option><option ${e.status==="Contacted"?"selected":""}>Contacted</option><option ${e.status==="Converted"?"selected":""}>Converted</option></select></div>`).join("")}</div>`;
 if(state.tab==="orders")return `<div class="panel"><h3>Order tracking</h3>${state.orders.map((o,i)=>`<div class="listrow"><span><b>${o.id} • ${o.customer}</b><small>${o.items}</small></span><select data-order="${i}">${["New","Confirmed","Processing","Ready","Completed"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")}</div>`;
 return `<div class="panel"><h3>Customer records</h3>${[...new Set(state.enquiries.map(e=>e.name))].map(n=>`<div class="listrow"><span><b>${n}</b><small>Customer • enquiry history available</small></span><i class="fa-solid fa-user"></i></div>`).join("")}</div>`;
}
function bind(){
 const menu=document.getElementById("menu"),nav=document.getElementById("navlinks");if(menu)menu.onclick=()=>nav.classList.toggle("open");
 const oa=document.getElementById("openAdmin");if(oa)oa.onclick=()=>{state.view="admin";render()};
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render()});
 const search=document.getElementById("search");if(search){search.oninput=e=>{state.query=e.target.value;render();search.focus();search.setSelectionRange(search.value.length,search.value.length)}}
 document.querySelectorAll("[data-product]").forEach(b=>b.onclick=()=>modal(state.products.find(p=>p.id==b.dataset.product)));
 document.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>wa(b.dataset.wa));
 const of=document.getElementById("orderForm");if(of)of.onsubmit=e=>{e.preventDefault();wa(document.getElementById("oc").value,document.getElementById("oq").value,document.getElementById("on").value)};
 const login=document.getElementById("loginBtn");if(login)login.onclick=()=>{state.admin=true;render()};
 const back=document.getElementById("backStore");if(back)back.onclick=()=>{state.view="store";render()};
 const sign=document.getElementById("signout");if(sign)sign.onclick=()=>{state.admin=false;render()};
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 document.querySelectorAll("[data-stock]").forEach(b=>b.onclick=()=>{let p=state.products.find(x=>x.id==b.dataset.stock);p.stock=p.stock==="In Stock"?"Low Stock":p.stock==="Low Stock"?"Out of Stock":"In Stock";save();render()});
 document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Remove this fabric from the catalogue?")){state.products=state.products.filter(p=>p.id!=b.dataset.delete);save();render()}});
 const add=document.getElementById("addProduct");if(add)add.onclick=()=>{state.products.unshift({id:Date.now(),name:"New Fabric",cat:"Custom Sourcing",desc:"Add product description in the production admin editor.",stock:"In Stock",img:"https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=900&q=80"});save();render()};
 document.querySelectorAll("[data-enq]").forEach(s=>s.onchange=e=>{state.enquiries[s.dataset.enq].status=e.target.value;render()});
 document.querySelectorAll("[data-order]").forEach(s=>s.onchange=e=>{state.orders[s.dataset.order].status=e.target.value;render()});
}
function modal(p){let shade=document.createElement("div");shade.className="modalshade";shade.innerHTML=`<div class="modal"><button class="close"><i class="fa-solid fa-xmark"></i></button><img src="${p.img}"><div><small>${p.cat}</small><h3>${p.name}</h3><p>${p.desc}</p><label>Quantity<input id="mq" placeholder="e.g. 30 yards"></label><label>Colour / notes<input id="mn" placeholder="Optional"></label><button class="btn wa" id="mw" style="width:100%">Request Price on WhatsApp <i class="fa-brands fa-whatsapp"></i></button></div></div>`;document.body.appendChild(shade);shade.onclick=e=>{if(e.target===shade)shade.remove()};shade.querySelector(".close").onclick=()=>shade.remove();shade.querySelector("#mw").onclick=()=>{wa(p.name,shade.querySelector("#mq").value,shade.querySelector("#mn").value);shade.remove()}}
render();
</script>
</body>
</html>
